spring.application.name=bora-api
server.port=8080

# H2 em arquivo (backend/data/bora.mv.db) — os dados sobrevivem a reinícios,
# e o seed (GrafoSeeder) só roda quando as tabelas estão vazias.
# SUBSTITUIR EM PRODUÇÃO: trocar por Postgres. Pra usar o Postgres do
# Supabase sem editar nada, exporte SPRING_DATASOURCE_URL / _USERNAME /
# _PASSWORD / _DRIVER_CLASS_NAME antes do run.sh (ver supabase/README.md).
spring.datasource.url=jdbc:h2:file:./data/bora;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do banco: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/bora  usuário: sa  senha em branco)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Respostas JSON em UTF-8 (nomes com acento)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
